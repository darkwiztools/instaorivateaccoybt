<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Instagram Private Viewer | by Aditya</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* Animated gradient orb */
    .orb {
      position: fixed;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0) 80%);
      border-radius: 50%;
      filter: blur(80px);
      animation: float 20s infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 { top: -20vh; left: -20vw; animation-duration: 25s; }
    .orb-2 { bottom: -30vh; right: -20vw; background: radial-gradient(circle, rgba(255, 107, 107, 0.2) 0%, rgba(0,0,0,0) 80%); animation-duration: 30s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 8%) scale(1.2); }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Glass card */
    .glass-card {
      background: rgba(15, 20, 35, 0.6);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .header {
      text-align: center;
      padding: 3rem 2rem;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #a0a8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      animation: fadeInDown 0.8s ease;
    }

    .credit {
      color: #ff6b6b;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 0.5rem;
      text-shadow: 0 0 10px rgba(255,107,107,0.3);
      animation: fadeInUp 0.8s ease;
    }

    .input-group {
      max-width: 500px;
      margin: 2rem auto;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-group input {
      flex: 1;
      padding: 1rem 1.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3rem;
      font-size: 1rem;
      color: white;
      transition: all 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 15px rgba(102,126,234,0.3);
    }

    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 3rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102,126,234,0.4);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .stats {
      text-align: center;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 400px;
      border-radius: 2rem;
      background: rgba(0,0,0,0.4);
    }

    .loader {
      display: none;
      justify-content: center;
      margin: 2rem 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
      animation: fadeIn 0.6s ease;
    }

    .post-card {
      background: rgba(20, 25, 45, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .post-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: rgba(102,126,234,0.5);
      box-shadow: 0 20px 35px rgba(0,0,0,0.5);
    }

    .post-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.5s;
    }

    .post-card:hover .post-image {
      transform: scale(1.03);
    }

    .post-info {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .post-id {
      font-size: 0.75rem;
      font-family: monospace;
      background: rgba(0,0,0,0.5);
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      color: #a0a8ff;
    }

    .download-btn {
      background: rgba(102,126,234,0.2);
      border: 1px solid #667eea;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: #667eea;
      transform: scale(1.05);
    }

    .error-message {
      background: rgba(255,107,107,0.2);
      border: 1px solid #ff6b6b;
      border-radius: 2rem;
      padding: 1.5rem;
      text-align: center;
      margin-top: 2rem;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .export-btn {
      background: rgba(255,255,255,0.1);
      margin-top: 1rem;
    }

    .footer {
      text-align: center;
      margin-top: 4rem;
      padding: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      color: #aaa;
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .header h1 { font-size: 2rem; }
      .gallery { gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="glass-card header">
      <h1>📸 Instagram Private Viewer</h1>
      <p>Extract highest resolution images from any profile</p>
      <div class="credit">✨ Developed by <strong>Aditya</strong> ✨</div>
    </div>

    <div class="glass-card" style="padding: 2rem;">
      <div class="input-group">
        <input type="text" id="username" placeholder="Enter Instagram username (e.g., cristiano)" autocomplete="off">
        <button class="btn" id="fetchBtn">🔍 Fetch Posts</button>
      </div>

      <div id="statsArea" class="stats" style="display: none;"></div>
      <div id="loader" class="loader"><div class="spinner"></div></div>
      <div id="gallery" class="gallery"></div>
      <div id="errorArea"></div>
      <div id="exportArea" style="text-align: center; margin-top: 1.5rem;"></div>
    </div>

    <div class="footer">
      ⚠️ Educational purpose only. Respect Instagram's terms.<br>
      Tool extracts publicly available timeline data. All credits to <strong>Developer Aditya</strong>.
    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <img src="" alt="Full size">
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const fetchBtn = document.getElementById('fetchBtn');
    const loader = document.getElementById('loader');
    const galleryDiv = document.getElementById('gallery');
    const statsArea = document.getElementById('statsArea');
    const errorArea = document.getElementById('errorArea');
    const exportArea = document.getElementById('exportArea');
    let currentPosts = [];

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');

    lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

    function openLightbox(url) {
      lightboxImg.src = url;
      lightbox.classList.add('active');
    }

    function exportUrls(posts) {
      const text = posts.map(p => `Post ID: ${p.postId}\nURL: ${p.url}`).join('\n\n');
      const blob = new Blob([text], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `instagram_${usernameInput.value}_urls.txt`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function renderGallery(posts, username) {
      galleryDiv.innerHTML = '';
      if (!posts.length) {
        galleryDiv.innerHTML = '<div class="error-message">No images found in this profile.</div>';
        return;
      }

      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <img class="post-image" src="${post.url}" alt="Post ${post.postId}" loading="lazy">
          <div class="post-info">
            <span class="post-id">📌 ${post.postId.slice(0, 12)}...</span>
            <a href="${post.url}" class="download-btn" download target="_blank">📥 Download</a>
          </div>
        `;
        const img = card.querySelector('.post-image');
        img.addEventListener('click', () => openLightbox(post.url));
        galleryDiv.appendChild(card);
      });

      statsArea.style.display = 'block';
      statsArea.innerHTML = `
        <strong>✅ ${posts.length} private posts accessed</strong><br>
        <span style="font-size: 0.9rem;">@${username} • Highest resolution images</span>
      `;
      exportArea.innerHTML = `<button class="btn export-btn" id="exportBtn">📄 Export URLs as TXT</button>`;
      document.getElementById('exportBtn').addEventListener('click', () => exportUrls(posts));
    }

    function showError(msg) {
      errorArea.innerHTML = `<div class="error-message">❌ ${msg}</div>`;
      galleryDiv.innerHTML = '';
      statsArea.style.display = 'none';
      exportArea.innerHTML = '';
    }

    async function fetchProfile() {
      const username = usernameInput.value.trim();
      if (!username) {
        showError('Please enter a username');
        return;
      }

      loader.style.display = 'flex';
      galleryDiv.innerHTML = '';
      errorArea.innerHTML = '';
      statsArea.style.display = 'none';
      exportArea.innerHTML = '';

      try {
        const response = await fetch('/api/fetch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to fetch data');
        }

        currentPosts = data.posts;
        renderGallery(currentPosts, data.username);
      } catch (err) {
        showError(err.message);
      } finally {
        loader.style.display = 'none';
      }
    }

    fetchBtn.addEventListener('click', fetchProfile);
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchProfile();
    });
  </script>
</body>
</html>
